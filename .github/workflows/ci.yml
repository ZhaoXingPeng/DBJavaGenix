name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    name: Commit and PR policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gitmoji titles
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python scripts/validate_commit_title.py \
              --title "$PR_TITLE" \
              --range "$PR_BASE_SHA..$PR_HEAD_SHA"
            python scripts/validate_commit_title.py --pr-event "$GITHUB_EVENT_PATH"
          else
            python scripts/validate_commit_title.py \
              --title "$(git log -1 --format=%s "$COMMIT_SHA")"
          fi

  quality:
    name: Python quality (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install development dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Ruff lint
        run: uv run ruff check src/ tests/ scripts/

      - name: Unit tests and coverage
        run: |
          uv run pytest tests/unit/ \
            --cov=src/dbjavagenix \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            --cov-fail-under=35

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  format:
    name: Changed-file format gate
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python and Ruff
        run: |
          uv python install 3.12
          uv venv --python 3.12
          uv pip install "ruff>=0.8"

      - name: Check changed Python files
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="${COMMIT_SHA}^"
            head="$COMMIT_SHA"
          fi
          mapfile -t files < <(git diff --name-only "$base" "$head" -- \
            'src/**/*.py' 'tests/**/*.py' 'scripts/**/*.py')
          if (( ${#files[@]} == 0 )); then
            echo "No Python files changed"
          else
            printf 'Formatting %s\n' "${files[@]}"
            uv run ruff format --check "${files[@]}"
          fi

  integration:
    name: Database integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install integration dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev,integration]"

      - name: Run Testcontainers integration suite
        run: uv run pytest tests/integration/ --no-cov -q

  templates:
    name: Template rendering contract
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install runtime dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e "."

      - name: Render every Java template
        run: uv run python scripts/verify_templates.py

  java-compile:
    name: Generated Java compile smoke
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install runtime dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e "."

      - name: Render and compile generated Java fixture
        run: |
          java --version
          mvn --version
          uv run python scripts/verify_java_compile.py

  npm-package:
    name: NPM package contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify packed wrapper contract
        run: |
          node --version
          npm --version
          npm run verify:package

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: dbjavagenix:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify import and non-root runtime
        run: |
          docker run --rm --entrypoint python dbjavagenix:ci \
            -c "import dbjavagenix; print(dbjavagenix.__version__)"
          test "$(docker run --rm --entrypoint id dbjavagenix:ci -u)" != "0"

  package:
    name: Python package build smoke test
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build wheel and source distribution
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]" "build>=1.2"
          uv run python -m build --sdist --wheel

      - name: Install wheel in an isolated environment
        run: |
          smoke_venv="$(mktemp -d)"
          uv venv "$smoke_venv" --python 3.12
          uv pip install --python "$smoke_venv/bin/python" dist/*.whl
          "$smoke_venv/bin/python" -c "import dbjavagenix; print(dbjavagenix.__version__)"
          "$smoke_venv/bin/dbjavagenix" --help >/dev/null

  ci-success:
    name: Required CI status
    if: always()
    needs: [metadata, quality, format, integration, templates, java-compile, npm-package, docker, package]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when any required job failed or was cancelled
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || \
                "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required CI jobs failed or was cancelled"
            exit 1
          fi
          echo "All required CI jobs passed"
