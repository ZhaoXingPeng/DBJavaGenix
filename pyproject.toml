[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbjavagenix"
version = "0.1.0"
description = "AI-enhanced Java code generator based on MCP service architecture"
authors = [
    {name = "ZXP", email = "2638265504@qq.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["mcp", "code-generation", "java", "database", "ai", "skills", "mcp-apps"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Database",
]

dependencies = [
    "mcp>=1.6.0",
    "pydantic>=2.10.0",
    "sqlalchemy>=2.0.36",
    "pymysql>=1.1.1",
    "psycopg2-binary>=2.9.10",
    "PyYAML>=6.0.2",
    "pystache>=0.6.5",
    "aiofiles>=24.1.0",
    "typer>=0.13.0",
    "rich>=13.9.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.22.0",
]

[project.scripts]
dbjavagenix = "dbjavagenix.cli:main"
dbjavagenix-server = "dbjavagenix.server:main"

[project.urls]
Homepage = "https://github.com/ZhaoXingPeng/DBJavaGenix"
Documentation = "https://github.com/ZhaoXingPeng/DBJavaGenix"
Repository = "https://github.com/ZhaoXingPeng/DBJavaGenix.git"
Issues = "https://github.com/ZhaoXingPeng/DBJavaGenix/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dbjavagenix = ["templates/**/*", "config/**/*"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".eggs", ".git", ".mypy_cache", ".venv", "build", "dist", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM"]
ignore = ["E203", "E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=src/dbjavagenix --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"
