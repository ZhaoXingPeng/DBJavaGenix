[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbjavagenix"
version = "0.1.0"
description = "AI-enhanced Java code generator based on MCP service architecture"
authors = [
    {name = "ZXP", email = "2638265504@qq.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["mcp", "code-generation", "java", "database", "ai", "skills", "mcp-apps"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Database",
]

dependencies = [
    "mcp>=1.6.0,<2.0",
    "pydantic>=2.10.0",
    "sqlalchemy>=2.0.36",
    "pymysql>=1.1.1",
    "psycopg2-binary>=2.9.10",
    "PyYAML>=6.0.2",
    "pystache>=0.6.5",
    "aiofiles>=24.1.0",
    "typer>=0.13.0",
    "rich>=13.9.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

integration = [
    "testcontainers[mysql,postgres]>=4.8.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.22.0",
]

[project.scripts]
dbjavagenix = "dbjavagenix.cli:main"
dbjavagenix-server = "dbjavagenix.server:main"

[project.urls]
Homepage = "https://github.com/ZhaoXingPeng/DBJavaGenix"
Documentation = "https://github.com/ZhaoXingPeng/DBJavaGenix"
Repository = "https://github.com/ZhaoXingPeng/DBJavaGenix.git"
Issues = "https://github.com/ZhaoXingPeng/DBJavaGenix/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dbjavagenix = ["templates/**/*", "config/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".eggs", ".git", ".mypy_cache", ".venv", "build", "dist", "node_modules"]
force-exclude = true

[tool.ruff.lint]
# 渐进引入: 先只检查真 bug 类规则(pyflakes F, 部分 E),
# 风格类(I 排序 / UP 升级语法 / SIM 简化) 后续单独 PR 用 ruff --fix 批改
select = ["F", "E9"]
ignore = [
    "E501",  # 行太长 -> 后续 ruff format 统一
    "F401",  # 未用 import -> __init__.py 经常正常使用
    "F841",  # 未用本地变量 -> codegen_tools.py 有 2 处可能是隐藏 bug, 留单独 PR
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# Legacy module is migrated incrementally; avoid whole-file formatter churn.
exclude = [
    "src/dbjavagenix/database/mcp_tools.py",
    "src/dbjavagenix/database/connection_manager.py",
    "src/dbjavagenix/server/mcp_server.py",
]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=src/dbjavagenix --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"
